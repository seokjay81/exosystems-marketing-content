name: Knowledge Sync

on:
  schedule:
    - cron: '0 0 * * 1'   # 매주 월요일 00:00 UTC
  workflow_dispatch:

jobs:
  sync:
    name: Sync inbox → products KB
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Process inbox files
        run: node scripts/sync-knowledge.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Rebuild merged KB
        run: node scripts/build-kb.js

      - name: Validate updated KB
        run: node scripts/validate-kb.js

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge-base/ src/lib/
          git diff --cached --quiet && echo "변경 없음 — 커밋 스킵" || \
            git commit -m "chore: auto-sync knowledge base [$(date +'%Y-%m-%d')]"
          git push
