name: KB Validate and Build

on:
  push:
    branches: [main]
    paths:
      - 'knowledge-base/**'
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Validate KB structure
        run: node scripts/validate-kb.js

      - name: Build unified PRODUCT_KB
        run: node scripts/build-kb.js

      - name: Commit built KB
        run: |
          git config --global user.name 'KB Build Bot'
          git config --global user.email 'kb-bot@exosystems.io'
          git add src/lib/product-kb.json public/PRODUCT_KB.js || true
          git diff --staged --quiet || git commit -m "auto: PRODUCT_KB 빌드 업데이트 - $(date '+%Y-%m-%d %H:%M')"
          git push || true
